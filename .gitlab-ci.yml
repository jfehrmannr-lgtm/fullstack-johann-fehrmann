image: node:20

stages:
  - build
  - deploy_prod

# 🔵 1. BUILD automático
build:
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist
    expire_in: 1 hour

# 🟣 2. DEPLOY manual
deploy_pages:
  stage: deploy_prod
  needs:
    - build
  script:
    - rm -rf public
    - mv dist public
  artifacts:
    paths:
      - public
  when: manual
  only:
    - main